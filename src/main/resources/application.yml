spring:
  application:
    name: url-shortener
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    clean-disabled: true
server:
  port: ${PORT:${SERVER_PORT:8080}}
app:
  base-url: ${BASE_URL:${RENDER_EXTERNAL_URL:http://localhost:${PORT:${SERVER_PORT:8080}}}}
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui.html
