spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 3000
        delivery.timeout.ms: 120000
  application:
    name: url-shortener
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    clean-disabled: true
server:
  port: ${PORT:${SERVER_PORT:8080}}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  events:
    enabled: ${KAFKA_EVENTS_ENABLED:true}
    topics:
      created: ${KAFKA_TOPIC_CREATED:short-url-created.v1}
      visited: ${KAFKA_TOPIC_VISITED:short-url-visited.v1}
  base-url: ${BASE_URL:${RENDER_EXTERNAL_URL:http://localhost:${PORT:${SERVER_PORT:8080}}}}
management:
  endpoints:
    web:
      exposure:
        include: health,info
springdoc:
  swagger-ui:
    path: /swagger-ui.html
